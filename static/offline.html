<!doctype html>
<html lang="en"><head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1c33bb" />
<title>Offline</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#1c33bb; color:#fff;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align:center; padding:24px; }
  img { width:84px; height:84px; border-radius:20px; margin-bottom:18px; }
  h1 { font-size:22px; margin:0 0 8px; } p { margin:0 0 20px; opacity:.8; max-width:22rem; line-height:1.45; }
  button { background:#07c067; color:#fff; border:0; border-radius:10px; padding:11px 22px; font-size:15px; font-weight:600; cursor:pointer; }
</style></head>
<body><main>
  <img src="/static/icons/android-chrome-192x192.png" alt="" />
  <h1>You're offline</h1>
  <p>Metro Packaging Depot needs a connection - the schedule, payroll and orders are live, so nothing is shown from memory. Check your wifi or data and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main></body></html>
